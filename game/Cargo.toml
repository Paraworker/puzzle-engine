[package]
name = "crazy-puzzle"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "A customizable rule-based puzzle game"

[dependencies]
bevy = "0.19"
bevy_egui = "0.40"
bevy_tweening = { git = "https://github.com/spebern/bevy_tweening.git", branch = "bevy-0.19" }
indexmap = { version = "2.13", features = ["serde"] }
ron = "0.12"
rulery = { path = "../rulery" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
